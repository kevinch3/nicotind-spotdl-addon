name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  docker:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nicotind-spotdl-addon
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # The version goes into the pip layer's command line so the Docker layer
      # cache can never pin an old yt-dlp again (NicotinD #588) — and it is
      # printed here so the run says which one shipped.
      - name: Resolve yt-dlp version
        id: ytdlp
        run: |
          v=$(curl -fsS https://pypi.org/pypi/yt-dlp/json | python3 -c 'import sys,json; print(json.load(sys.stdin)["info"]["version"])')
          test -n "$v"
          echo "yt-dlp $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build (push on push events)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
